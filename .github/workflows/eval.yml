name: Eval Suite

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.SCRATCH_REPO_GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed the scratch repo
        run: python seed.py

      - name: Run the eval suite (code-enforced policy)
        run: python eval.py --condition code-enforced
